<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Study · Nataly C</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black: #0a0a0a;
  --white: #f5f3ef;
  --mid: #8a8680;
  --line: rgba(10,10,10,0.12);
  --pad: clamp(1.5rem, 5vw, 3.5rem);
}

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  font-family: 'Syne', sans-serif;
  background: var(--white);
  color: var(--black);
  line-height: 2;
  -webkit-font-smoothing: antialiased;
}

/* Subtle grain overlay (matches portfolio) */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none;
  opacity: 0.038;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 256px;
  mix-blend-mode: multiply;
}

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: clamp(2.5rem, 6vw, 5rem) var(--pad) clamp(4rem, 8vw, 7rem);
}

/* ── Top nav (back to portfolio) ── */
.case-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: clamp(2.5rem, 5vw, 4rem);
  margin-bottom: clamp(2.5rem, 5vw, 4rem);
  border-bottom: 1px solid var(--line);
}
.case-nav-logo {
  font-family: 'Syne', sans-serif;
  font-size: 0.85rem;
  font-weight: 200;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--black);
  text-decoration: none;
}
.case-nav-back {
  font-family: 'Syne', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--black);
  opacity: 0.55;
  text-decoration: none;
  transition: opacity 0.2s ease;
}
.case-nav-back:hover { opacity: 1; }

/* ── Cover tags ── */
.cover-tags {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 2rem;
}
.ctag {
  font-size: 0.55rem;
  font-weight: 400;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mid);
  border: 1px solid var(--line);
  padding: 0.3rem 0.7rem;
  background: transparent;
}

/* ── Title + subtitle ── */
h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(48px, 7vw, 96px);
  font-weight: 300;
  line-height: 0.95;
  letter-spacing: -0.025em;
  margin-bottom: 0.6rem;
  color: var(--black);
}
.subtitle {
  font-family: 'Syne', sans-serif;
  font-style: italic;
  font-size: clamp(22px, 3vw, 36px);
  font-weight: 300;
  line-height: 1.2;
  letter-spacing: -0.01em;
  color: var(--mid);
  margin-bottom: clamp(2.5rem, 5vw, 4rem);
}

/* ── Meta grid ── */
.meta-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  margin-bottom: clamp(2.5rem, 5vw, 4rem);
  background: transparent;
  border-radius: 0;
  overflow: visible;
  gap: 0;
}
.meta-cell {
  background: transparent;
  padding: 1.2rem 1.4rem 1.2rem 0;
  border-right: 1px solid var(--line);
}
.meta-cell:last-child { border-right: none; padding-right: 0; }
.meta-cell:not(:first-child) { padding-left: 1.4rem; }
.meta-key {
  font-size: 0.55rem;
  font-weight: 400;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 0.5rem;
}
.meta-val {
  font-family: 'Syne', sans-serif;
  font-size: 1.1rem;
  font-weight: 300;
  color: var(--black);
  line-height: 1.4;
  letter-spacing: -0.005em;
}

/* ── Pitch + summary lead ── */
.pitch {
  font-family: 'Syne', sans-serif;
  font-style: italic;
  font-size: clamp(22px, 3vw, 32px);
  font-weight: 300;
  line-height: 1.4;
  letter-spacing: -0.01em;
  text-align: center;
  color: var(--black);
  max-width: 720px;
  margin: 0 auto 2rem;
  padding: 0 0.5rem;
}
.summary {
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  line-height: 2;
  color: var(--mid);
  max-width: 720px;
  margin: 0 auto clamp(3rem, 6vw, 4rem);
  text-align: center;
  padding: 0 0.5rem;
}

/* ── Image row ── */
.img-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
  margin-bottom: clamp(3rem, 6vw, 5rem);
}
.img-row img {
  aspect-ratio: 16/10;
  width: 100%;
  object-fit: cover;
  border-radius: 0;
  display: block;
}
.img-ph {
  aspect-ratio: 16/10;
  background: #e8e6e2;
  border: 1px solid var(--line);
  border-radius: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Syne', sans-serif;
  font-style: italic;
  font-size: 1rem;
  font-weight: 300;
  color: rgba(10,10,10,0.18);
  letter-spacing: -0.005em;
}

/* ── Section dividers ── */
hr {
  border: none;
  border-top: 1px solid var(--line);
  margin: clamp(3rem, 6vw, 5rem) 0;
}
section {
  margin-bottom: clamp(2rem, 4vw, 3rem);
}

/* ── Section labels + headlines ── */
.sec-num {
  font-size: 0.55rem;
  font-weight: 400;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 1.2rem;
  display: flex;
  align-items: center;
  gap: 0.7rem;
}
.sec-num::before {
  content: '';
  width: 24px;
  height: 1px;
  background: var(--mid);
}
h2 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(32px, 4.5vw, 56px);
  font-weight: 300;
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: clamp(1.6rem, 3vw, 2.4rem);
  color: var(--black);
}
h3 {
  font-family: 'Syne', sans-serif;
  font-size: 0.6rem;
  font-weight: 400;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--black);
  margin: 2.5rem 0 0.8rem;
  opacity: 0.75;
}
section > h3:first-of-type,
section > .chips:first-child + h3,
section .card + h3 { margin-top: 2.4rem; }
section > *:first-child + h3,
section > h3:first-child { margin-top: 0; }

p {
  font-size: 0.7rem;
  letter-spacing: 0.04em;
  line-height: 2;
  color: var(--mid);
  margin-bottom: 1rem;
  max-width: 680px;
}

/* ── Method chips ── */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1.6rem;
}
.chip {
  font-size: 0.55rem;
  font-weight: 400;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mid);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 0.3rem 0.7rem;
}

/* ── Cards (findings, decisions, audit) ── */
.cards {
  display: flex;
  flex-direction: column;
  margin: 1.5rem 0 1.8rem;
  gap: 0;
}
.card {
  background: transparent;
  border: none;
  border-top: 1px solid var(--line);
  border-radius: 0;
  padding: 1.4rem 0;
}
.cards .card:last-child { border-bottom: 1px solid var(--line); }
.card-lbl {
  font-size: 0.5rem;
  font-weight: 400;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mid);
  opacity: 0.6;
  margin-bottom: 0.5rem;
}
.card strong {
  display: block;
  font-family: 'Syne', sans-serif;
  font-size: clamp(18px, 1.8vw, 22px);
  font-weight: 300;
  letter-spacing: -0.005em;
  color: var(--black);
  margin-bottom: 0.5rem;
  line-height: 1.3;
}
.card p {
  font-size: 0.65rem;
  line-height: 1.85;
  margin-bottom: 0.4rem;
}
.card em {
  font-style: italic;
  font-size: 0.65rem;
  color: var(--mid);
  letter-spacing: 0.04em;
}

/* ── Severity badges ── */
.sev {
  display: inline-block;
  font-family: 'Syne', sans-serif;
  font-size: 0.5rem;
  font-weight: 400;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 0.2rem 0.6rem;
  margin-left: 0.6rem;
  border: 1px solid currentColor;
  border-radius: 0;
  background: transparent;
  vertical-align: middle;
}
.sev-c { color: #b94a48; }
.sev-h { color: #c97a36; }
.sev-m { color: #a18a2a; }
.sev-l { color: #5a8a5a; }

/* ── Principle list ── */
.principle-row {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  padding: 0.85rem 0;
  border-bottom: 1px solid var(--line);
  margin-bottom: 0;
}
.principle-row:first-of-type { border-top: 1px solid var(--line); }
.p-name {
  font-size: 0.7rem;
  font-weight: 400;
  letter-spacing: 0.04em;
  color: var(--black);
}
.p-desc {
  font-size: 0.65rem;
  letter-spacing: 0.04em;
  color: var(--mid);
  line-height: 1.7;
}

/* ── Quotes ── */
blockquote {
  font-family: 'Syne', sans-serif;
  font-style: italic;
  font-size: clamp(16px, 1.5vw, 20px);
  font-weight: 300;
  line-height: 1.55;
  letter-spacing: -0.005em;
  color: var(--black);
  padding: 0.6rem 0 0.6rem 1.4rem;
  margin: 1.2rem 0;
  border-left: 1px solid var(--mid);
  border-radius: 0;
  background: transparent;
  max-width: 680px;
}

/* ── Footer ── */
.case-footer {
  margin-top: clamp(4rem, 8vw, 6rem);
  padding-top: clamp(2.5rem, 5vw, 4rem);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}
.case-footer-copy {
  font-size: 0.55rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mid);
  opacity: 0.55;
}
.case-footer-back {
  font-family: 'Syne', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--black);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  transition: opacity 0.2s ease;
}
.case-footer-back:hover { opacity: 0.55; }

/* ── Image lightbox ── */
.img-row img {
  cursor: zoom-in;
  transition: opacity 0.2s ease;
}
.img-row img:hover { opacity: 0.88; }
.lightbox {
  position: fixed; inset: 0;
  background: rgba(10,10,10,0.96);
  z-index: 1000; display: none;
  align-items: center; justify-content: center;
  padding: clamp(2rem, 5vw, 4rem);
  cursor: zoom-out;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.lightbox.open { display: flex; }
.lightbox-img {
  max-width: 100%; max-height: 88vh;
  object-fit: contain;
  cursor: default;
  animation: lbZoom 0.28s ease;
  display: block;
}
@keyframes lbZoom {
  from { opacity: 0; transform: scale(0.96); }
  to   { opacity: 1; transform: scale(1); }
}
.lightbox-close {
  position: absolute;
  top: clamp(1.2rem, 3vw, 2.2rem);
  right: clamp(1.2rem, 3vw, 2.2rem);
  width: 44px; height: 44px;
  background: transparent;
  border: 1px solid rgba(245,243,239,0.35);
  color: #f5f3ef;
  font-size: 22px; line-height: 1;
  font-family: inherit;
  cursor: pointer;
  border-radius: 0;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}
.lightbox-close:hover {
  background: #f5f3ef;
  color: #0a0a0a;
  border-color: #f5f3ef;
}
.lightbox-caption {
  position: absolute;
  bottom: clamp(1.2rem, 3vw, 2.2rem);
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Syne', sans-serif;
  font-size: 0.55rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(245,243,239,0.7);
  text-align: center;
  max-width: 80vw;
}
.lightbox-counter {
  position: absolute;
  top: clamp(1.2rem, 3vw, 2.2rem);
  left: clamp(1.2rem, 3vw, 2.2rem);
  font-family: 'Syne', sans-serif;
  font-size: 0.55rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(245,243,239,0.55);
}

/* ── Responsive ── */
@media (max-width: 768px) {
  .meta-grid { grid-template-columns: 1fr 1fr; }
  .meta-cell { padding: 1rem 1rem 1rem 0; }
  .meta-cell:nth-child(2) { border-right: none; padding-right: 0; }
  .meta-cell:nth-child(3),
  .meta-cell:nth-child(4) {
    border-top: 1px solid var(--line);
    padding-top: 1rem;
  }
  .meta-cell:nth-child(3) { padding-left: 0; }
  .img-row { grid-template-columns: 1fr; gap: 0.6rem; }
  .pitch, .summary { text-align: left; padding: 0; }
  h1 { font-size: clamp(36px, 9vw, 56px); }
  .subtitle { font-size: clamp(18px, 5vw, 24px); }
  h2 { font-size: clamp(26px, 6vw, 38px); }
  .case-footer { flex-direction: column; align-items: flex-start; }
}
</style></head><body><div class="wrap">
<div class="case-nav">
  <a class="case-nav-logo" href="../">Nataly · C</a>
  <a class="case-nav-back" href="../">← Portfolio</a>
</div>
<div id="cs-content"><p style="font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;color:#8a8680;padding:4rem 0;">Loading…</p></div>
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  if (!slug) {
    document.getElementById('cs-content').innerHTML = '<p style="color:#b94a48;padding:4rem 0;">No case study specified. Add ?slug=your-slug to the URL.</p>';
    return;
  }

  const url = '/case-studies/published/case-study-' + slug + '.json';

  fetch(url, { cache: 'no-store' })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(d) {
      document.title = (d.title || 'Case Study') + ' · Nataly C';

      const imgSrc = function(img) { return img && img.src ? img.src : img; };
      const imgs = (d.imageData || []).filter(Boolean);
      const paras = function(txt) {
        return String(txt || '').split(/\n+/).filter(function(t){ return t.trim(); })
          .map(function(t){ return '<p>' + t.trim() + '</p>'; }).join('');
      };
      const s = d.sections || {};
      let n = 0;
      const numLabel = function(label) { return '0' + (++n) + ' — ' + label; };
      const hasContent = function(obj) {
        return obj && Object.values(obj).some(function(v){ return Array.isArray(v) ? v.length : (v && String(v).trim()); });
      };

      // Tags
      const tagsHTML = (d.tags || []).map(function(t){ return '<span class="ctag">' + t + '</span>'; }).join('');

      // Meta
      const metaHTML = '<div class="meta-grid">'
        + '<div class="meta-cell"><div class="meta-key">Year</div><div class="meta-val">' + (d.year || '—') + '</div></div>'
        + '<div class="meta-cell"><div class="meta-key">Tags</div><div class="meta-val">' + ((d.tags || []).slice(0,2).join(', ') || '—') + '</div></div>'
        + '<div class="meta-cell"><div class="meta-key">Role</div><div class="meta-val">' + (d.role || '—') + '</div></div>'
        + '<div class="meta-cell"><div class="meta-key">Status</div><div class="meta-val">' + (d.status || 'Shipped') + '</div></div>'
        + '</div>';

      // Images
      let imgsHTML = '';
      if (imgs.length) {
        imgsHTML = '<div class="img-row">' + imgs.slice(0,3).map(function(img){
          return '<img src="' + imgSrc(img) + '" alt="' + (img && img.alt ? img.alt : d.title) + '" loading="lazy">';
        }).join('') + '</div>';
      }

      // Sections body
      let bodyHTML = '';
      if (hasContent(s.problem)) {
        const pr = s.problem;
        bodyHTML += '<section><span class="sec-num">' + numLabel('Problem &amp; Context') + '</span>'
          + (pr.statement ? '<p class="pitch">' + pr.statement + '</p>' : '')
          + (pr.bizCtx ? paras(pr.bizCtx) : '')
          + (pr.who ? '<h3>Who\'s affected</h3>' + paras(pr.who) : '')
          + (pr.why ? '<h3>Why it matters</h3>' + paras(pr.why) : '')
          + (pr.constraints ? '<h3>Constraints</h3>' + paras(pr.constraints) : '')
          + '</section><hr>';
      }
      if (hasContent(s.insight)) {
        const ins = s.insight;
        const insMethods = (ins.methods || []);
        bodyHTML += '<section><span class="sec-num">' + numLabel('Insight') + '</span>'
          + (insMethods.length ? '<div class="chips">' + insMethods.map(function(m){ return '<span class="chip">' + m + '</span>'; }).join('') + '</div>' : '')
          + ((ins.findings || []).length ? '<div class="cards">' + ins.findings.slice(0,4).map(function(f,i){
              return '<div class="card"><div class="card-lbl">F' + String(i+1).padStart(2,'0') + '</div>'
                + (f.finding ? '<strong style="font-size:0.7rem;letter-spacing:0.04em;">' + f.finding + '</strong>' : '')
                + (f.evidence ? '<p>' + f.evidence + '</p>' : '')
                + (f.implication ? '<p style="font-style:italic">→ ' + f.implication + '</p>' : '')
                + '</div>';
            }).join('') + '</div>' : '')
          + (ins.decision ? '<h3>The decision</h3>' + paras(ins.decision) : '')
          + '</section><hr>';
      }
      if (hasContent(s.research)) {
        const r = s.research;
        const methods = (r.methods || []);
        bodyHTML += '<section><span class="sec-num">' + numLabel('Research') + '</span>'
          + (methods.length ? '<div class="chips">' + methods.map(function(m){ return '<span class="chip">' + m + '</span>'; }).join('') + '</div>' : '')
          + (r.goals ? '<h3>Goals</h3>' + paras(r.goals) : '')
          + ((r.findings || []).length ? '<div class="cards">' + r.findings.slice(0,4).map(function(f,i){
              return '<div class="card"><div class="card-lbl">F' + String(i+1).padStart(2,'0') + '</div>'
                + (f.finding ? '<strong style="font-size:0.7rem;letter-spacing:0.04em;">' + f.finding + '</strong>' : '')
                + (f.evidence ? '<p>' + f.evidence + '</p>' : '')
                + (f.implication ? '<p style="font-style:italic">→ ' + f.implication + '</p>' : '')
                + '</div>';
            }).join('') + '</div>' : '')
          + (r.synthesis ? '<h3>Synthesis</h3>' + paras(r.synthesis) : '')
          + '</section><hr>';
      }
      if (hasContent(s.define)) {
        const df = s.define;
        bodyHTML += '<section><span class="sec-num">' + numLabel('Define') + '</span>'
          + (df.hmw ? '<blockquote>' + df.hmw + '</blockquote>' : '')
          + (df.coreNeed ? '<h3>Core need</h3>' + paras(df.coreNeed) : '')
          + ((df.principles || []).length ? '<div class="cards">' + df.principles.map(function(pp){
              return '<div class="card"><div class="principle-row"><span class="p-name">' + pp.name + '</span>'
                + (pp.desc ? '<span class="p-desc"> — ' + pp.desc + '</span>' : '')
                + '</div></div>';
            }).join('') + '</div>' : '')
          + (df.successMetrics ? '<h3>Success metrics</h3>' + paras(df.successMetrics) : '')
          + '</section><hr>';
      }
      if (hasContent(s.design)) {
        const dg = s.design;
        bodyHTML += '<section><span class="sec-num">' + numLabel('Approach') + '</span>'
          + (dg.solution ? paras(dg.solution) : '')
          + (dg.flows ? '<h3>Key flows</h3>' + paras(dg.flows) : '')
          + (dg.annotations ? '<h3>Decisions</h3>' + paras(dg.annotations) : '')
          + '</section><hr>';
      }
      if (hasContent(s.outcome)) {
        const oc = s.outcome;
        bodyHTML += '<section><span class="sec-num">' + numLabel('Outcome') + '</span>'
          + (oc.shipped ? paras(oc.shipped) : '')
          + (oc.measures ? '<h3>Measures that matter</h3>' + paras(oc.measures) : '')
          + (oc.learnings ? '<h3>Learnings</h3>' + paras(oc.learnings) : '')
          + '</section>';
      }
      if (hasContent(s.outcomes)) {
        const out = s.outcomes;
        bodyHTML += '<section><span class="sec-num">' + numLabel('Outcomes') + '</span>'
          + (out.shipped ? paras(out.shipped) : '')
          + (out.metrics ? '<h3>Success criteria</h3>' + paras(out.metrics) : '')
          + (out.qualFeedback ? out.qualFeedback.split(/\n+/).filter(function(l){ return l.trim(); }).slice(0,2)
              .map(function(q){ return '<blockquote>' + q.trim() + '</blockquote>'; }).join('') : '')
          + '</section><hr>';
      }
      if (s.reflections && (s.reflections.learnings || s.reflections.worked)) {
        bodyHTML += '<section><span class="sec-num">' + numLabel('Reflections') + '</span>'
          + paras(s.reflections.learnings || s.reflections.worked)
          + '</section>';
      }
      if (!bodyHTML) {
        bodyHTML = paras(d.summary || '');
      }

      // Gallery (images 2+)
      let galleryHTML = '';
      if (imgs.length > 3) {
        galleryHTML = '<div class="img-row" style="margin-top:clamp(3rem,6vw,5rem)">'
          + imgs.slice(3).map(function(img){
            return '<img src="' + imgSrc(img) + '" alt="' + (img && img.alt ? img.alt : '') + '" loading="lazy">';
          }).join('') + '</div>';
      }

      document.getElementById('cs-content').innerHTML =
        '<div class="cover-tags">' + tagsHTML + '</div>'
        + '<h1>' + (d.title || 'Untitled') + '</h1>'
        + (d.subtitle ? '<p class="subtitle">' + d.subtitle + '</p>' : '')
        + metaHTML
        + (d.summary ? '<p class="pitch">' + d.summary + '</p>' : '')
        + imgsHTML
        + bodyHTML
        + galleryHTML;
    })
    .catch(function(err) {
      document.getElementById('cs-content').innerHTML = '<p style="color:#b94a48;padding:4rem 0;">Could not load case study (' + err.message + '). Make sure the server is running.</p>';
    });
})();
</script>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" aria-hidden="true">
  <span class="lightbox-counter" id="lightboxCounter"></span>
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close image">×</button>
  <img class="lightbox-img" id="lightboxImg" alt="">
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>
<script>
(function(){
  const lb = document.getElementById('lightbox');
  if (!lb) return;
  const lbImg = document.getElementById('lightboxImg');
  const lbCap = document.getElementById('lightboxCaption');
  const lbCount = document.getElementById('lightboxCounter');
  const lbClose = document.getElementById('lightboxClose');
  // Collect all clickable images (from .img-row only — avoids the case-nav logo etc.)
  const imgs = Array.from(document.querySelectorAll('.img-row img'));
  let currentIdx = -1;

  function openAt(idx) {
    if (idx < 0 || idx >= imgs.length) return;
    currentIdx = idx;
    const img = imgs[idx];
    lbImg.src = img.currentSrc || img.src;
    lbImg.alt = img.alt || '';
    lbCap.textContent = img.alt || '';
    lbCount.textContent = imgs.length > 1 ? (idx + 1) + ' / ' + imgs.length : '';
    lb.classList.add('open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    lbClose.focus();
  }
  function close() {
    lb.classList.remove('open');
    lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    // Restore focus to the image we opened from
    if (currentIdx > -1 && imgs[currentIdx]) imgs[currentIdx].focus();
    setTimeout(function(){ lbImg.src = ''; }, 280);
  }
  function next(delta) {
    if (currentIdx < 0) return;
    const n = (currentIdx + delta + imgs.length) % imgs.length;
    openAt(n);
  }

  imgs.forEach(function(img, i){
    img.style.cursor = 'zoom-in';
    img.tabIndex = 0;
    img.addEventListener('click', function(){ openAt(i); });
    img.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAt(i); }
    });
  });

  lbClose.addEventListener('click', function(e){ e.stopPropagation(); close(); });
  // Click anywhere in the lightbox except the image closes it
  lb.addEventListener('click', function(e){
    if (e.target !== lbImg) close();
  });
  document.addEventListener('keydown', function(e){
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') next(1);
    else if (e.key === 'ArrowLeft')  next(-1);
  });
})();
</script>
